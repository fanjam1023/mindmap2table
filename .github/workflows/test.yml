name: Test and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: node --check .mnaddon-work/main.js
      - run: node tests/all-v4.2.0.js
      - run: python3 scripts/package-addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: mindmap2table-addon
          path: dist/*.mnaddon
